name: AI PR create prototype

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: "codex/* branch to open the PR from"
        required: true
        type: string
      base_branch:
        description: "Active phase branch to open the PR into"
        required: true
        type: string
      title:
        description: "Pull request title"
        required: true
        type: string
      body:
        description: "Pull request body"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.create.outputs.pr_url }}
      pr_number: ${{ steps.create.outputs.pr_number }}
      existing_pr: ${{ steps.create.outputs.existing_pr }}
    steps:
      - name: Validate inputs and create PR
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%%/*}"
          CONTEXT_REF="${BASE_BRANCH}"

          echo "Requested head branch: ${HEAD_BRANCH}"
          echo "Requested base branch: ${BASE_BRANCH}"
          echo "Reading active phase branch from docs/CODEX_ACTIVE_CONTEXT.md at target base ref: ${CONTEXT_REF}"

          active_context="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/docs/CODEX_ACTIVE_CONTEXT.md?ref=${CONTEXT_REF}" \
            --jq '.content' | base64 --decode)"
          active_phase_branch="$(printf '%s\n' "${active_context}" | sed -n 's/^- Active phase branch: `\([^`]*\)`.*/\1/p' | head -n 1)"

          if [ -z "${active_phase_branch}" ]; then
            echo "::error::Could not determine the active phase branch from docs/CODEX_ACTIVE_CONTEXT.md."
            exit 1
          fi

          echo "Documented active phase branch: ${active_phase_branch}"

          if [ "${BASE_BRANCH}" = "main" ]; then
            echo "::error::Refusing to create an AI PR into main. Use the documented active phase branch (${active_phase_branch})."
            exit 1
          fi

          if [ "${BASE_BRANCH}" != "${active_phase_branch}" ]; then
            echo "::error::Refusing to create PR into '${BASE_BRANCH}'. docs/CODEX_ACTIVE_CONTEXT.md documents active phase branch '${active_phase_branch}'."
            exit 1
          fi

          case "${HEAD_BRANCH}" in
            codex/*) ;;
            *)
              echo "::error::Refusing to create PR from '${HEAD_BRANCH}'. Head branch must start with 'codex/'."
              exit 1
              ;;
          esac

          if [ "${HEAD_BRANCH}" = "${BASE_BRANCH}" ]; then
            echo "::error::Refusing to create PR because head_branch equals base_branch ('${HEAD_BRANCH}')."
            exit 1
          fi

          existing_pr="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --head "${HEAD_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --json number,url \
            --jq '.[0] // empty')"

          if [ -n "${existing_pr}" ]; then
            pr_number="$(printf '%s' "${existing_pr}" | jq -r '.number')"
            pr_url="$(printf '%s' "${existing_pr}" | jq -r '.url')"
            echo "Existing open PR found: #${pr_number} ${pr_url}"
            echo "existing_pr=true" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
            echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "No existing open PR found for ${HEAD_BRANCH} -> ${BASE_BRANCH}. Creating PR."
          pr_url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${OWNER}:${HEAD_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}")"
          pr_number="$(gh pr view "${pr_url}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json number \
            --jq '.number')"

          echo "Created PR: #${pr_number} ${pr_url}"
          echo "existing_pr=false" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
