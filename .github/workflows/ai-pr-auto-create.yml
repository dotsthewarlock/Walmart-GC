name: AI PR auto-create

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:
    inputs:
      head_branch:
        description: "codex/* branch to open the PR from"
        required: true
        type: string
      base_branch:
        description: "Active phase branch to open the PR into"
        required: true
        type: string
      title:
        description: "Pull request title"
        required: true
        type: string
      body:
        description: "Pull request body"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "ai-pr-auto-create-${{ github.event_name == 'push' && github.ref_name || inputs.head_branch }}-${{ github.event_name == 'push' && 'phase-13' || inputs.base_branch }}"
  cancel-in-progress: false


jobs:
  create-pr:
    name: Create Codex PR
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.create.outputs.pr_url }}
      pr_number: ${{ steps.create.outputs.pr_number }}
      existing_pr: ${{ steps.create.outputs.existing_pr }}

    steps:
      - name: Validate policy and create PR
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: "${{ github.event_name == 'push' && github.ref_name || inputs.head_branch }}"
          BASE_BRANCH: "${{ github.event_name == 'push' && 'phase-13' || inputs.base_branch }}"
          PR_TITLE: "${{ github.event_name == 'push' && format('AI: {0}', github.ref_name) || inputs.title }}"
          PR_BODY: "${{ github.event_name == 'push' && format('Automated guarded PR for `{0}` into `phase-13` after a codex/* branch push. Manual workflow_dispatch remains available as a fallback.', github.ref_name) || inputs.body }}"
          TRIGGER_EVENT: "${{ github.event_name }}"
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%%/*}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          policy_file="${tmp_dir}/ai-automation-policy.yml"
          active_context_file="${tmp_dir}/CODEX_ACTIVE_CONTEXT.md"

          echo "Trigger event: ${TRIGGER_EVENT}"
          echo "Requested head branch: ${HEAD_BRANCH}"
          echo "Requested base branch: ${BASE_BRANCH}"
          echo "Reading policy from requested base branch ${BASE_BRANCH}."

          gh api -H "Accept: application/vnd.github.raw" \
            "/repos/${GITHUB_REPOSITORY}/contents/.github/ai-automation-policy.yml?ref=${BASE_BRANCH}" > "${policy_file}"

          policy_active_base="$(sed -n 's/^active_base:[[:space:]]*//p' "${policy_file}" | tr -d '"' | head -n 1)"
          auto_pr_enabled="$(sed -n '/^auto_pr:/,/^[^[:space:]]/ s/^[[:space:]]*enabled:[[:space:]]*//p' "${policy_file}" | tr -d '"' | head -n 1)"

          if [ "${auto_pr_enabled}" != "true" ]; then
            echo "::error::Policy auto_pr.enabled is not true; refusing to create PR."
            exit 1
          fi

          if [ -z "${policy_active_base}" ]; then
            echo "::error::Could not determine policy active_base."
            exit 1
          fi
          if [ "${policy_active_base}" = "main" ]; then
            echo "::error::Policy active_base is main; refusing automation."
            exit 1
          fi

          gh api -H "Accept: application/vnd.github.raw" \
            "/repos/${GITHUB_REPOSITORY}/contents/docs/CODEX_ACTIVE_CONTEXT.md?ref=${BASE_BRANCH}" > "${active_context_file}"

          documented_active_base="$(sed -n 's/^- Active phase branch: `\([^`]*\)`.*/\1/p' "${active_context_file}" | head -n 1)"
          if [ -z "${documented_active_base}" ]; then
            echo "::error::Could not determine the active phase branch from docs/CODEX_ACTIVE_CONTEXT.md at ${BASE_BRANCH}."
            exit 1
          fi

          echo "Policy active_base: ${policy_active_base}"
          echo "Documented active phase branch: ${documented_active_base}"

          if [ "${BASE_BRANCH}" = "main" ]; then
            echo "::error::Refusing to create an AI PR into main."
            exit 1
          fi
          if [ "${BASE_BRANCH}" != "${policy_active_base}" ]; then
            echo "::error::Refusing base '${BASE_BRANCH}'; policy active_base is '${policy_active_base}'."
            exit 1
          fi
          if [ "${BASE_BRANCH}" != "${documented_active_base}" ]; then
            echo "::error::Refusing base '${BASE_BRANCH}'; docs active phase branch is '${documented_active_base}'."
            exit 1
          fi

          case "${HEAD_BRANCH}" in
            codex/*) ;;
            *)
              echo "::error::Refusing head '${HEAD_BRANCH}'. Head branch must start with 'codex/'."
              exit 1
              ;;
          esac

          if [ "${HEAD_BRANCH}" = "${BASE_BRANCH}" ]; then
            echo "::error::Refusing to create PR because head_branch equals base_branch ('${HEAD_BRANCH}')."
            exit 1
          fi

          existing_pr="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --head "${HEAD_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --json number,url \
            --jq '.[0] // empty')"

          if [ -n "${existing_pr}" ]; then
            pr_number="$(printf '%s' "${existing_pr}" | jq -r '.number')"
            pr_url="$(printf '%s' "${existing_pr}" | jq -r '.url')"
            echo "Existing open PR found: #${pr_number} ${pr_url}"
            echo "existing_pr=true" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
            echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "No existing open PR found for ${HEAD_BRANCH} -> ${BASE_BRANCH}. Creating PR."
          pr_url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${OWNER}:${HEAD_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}")"

          pr_number="$(gh pr view "${pr_url}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json number \
            --jq '.number')"

          echo "Created PR: #${pr_number} ${pr_url}"
          echo "existing_pr=false" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
