name: validate

on:
  pull_request:
    branches:
      - phase-11

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend JavaScript
        run: node --check app.js
      - name: Check Worker JavaScript
        run: node --check worker/src/index.js
      - name: Check whitespace
        run: git diff --check
      - name: Check conflict markers
        run: '! grep -R "<<<<<<<\|=======\|>>>>>>>" .'
