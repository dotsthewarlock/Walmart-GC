# Policy knobs for future AI PR lifecycle automation.
# This file is consumed by .github/scripts/ai_risk_classify.py and is not
# wired into AI PR creation and auto-merge workflows.
active_base: phase-12
allowed_head_patterns:
  - codex/**
auto_pr:
  enabled: true
auto_merge:
  enabled: true
  green: true
low_risk_paths:
  - docs/**
  - README.md
  - AGENTS.md
  - .github/copilot-instructions.md
blocked_paths:
  - worker/src/index.js
  - app.js
  - apps-script/**
  - .github/workflows/**
  - wrangler.toml
  - index.html
  - styles.css
blocked_keywords:
  - GOOGLE_CLIENT_SECRET
  - SESSION_SECRET
  - refresh_token
  - access_token
  - OAuth
  - sheetVersion
  - cardNumber
  - merchantInferred
  - gh pr close
  - gh pr merge
  - git push --force
binary_file_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .webp
  - .ico
  - .pdf
  - .zip
  - .gz
  - .tar
  - .tgz
  - .woff
  - .woff2
  - .ttf
  - .otf
  - .eot
restricted_labels:
  - ai:restricted
  - ai:blocked
  - risk:red
