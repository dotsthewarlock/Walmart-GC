name = "walmart-gc-oauth"
main = "src/index.js"
compatibility_date = "2026-06-11"

# Secrets must be configured with `wrangler secret put` or in the Cloudflare dashboard:
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - SESSION_SECRET
[vars]
FRONTEND_ORIGIN = "https://walmart-gc.dotsthewarlock.com"
REDIRECT_URI = "https://walmart-gc.dotsthewarlock.com/auth/callback"

# Placeholder KV IDs are intentional in source control. Do not deploy this file
# unchanged with wrangler: replace each id with the real Cloudflare KV namespace
# id for the target account/environment, or configure equivalent bindings in the
# Cloudflare dashboard/deployment pipeline before publishing the Worker.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "OAUTH_STATE"
id = "REPLACE_WITH_OAUTH_STATE_KV_NAMESPACE_ID"
